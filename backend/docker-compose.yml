
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DazzyCoffee-backend
    ports:
      - "5000:5000"
    volumes:
      - DazzCoffee_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  DazzCoffee_data:

